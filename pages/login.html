<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ekklesia | Login</title>

    <link rel="stylesheet" href="../css/global.css">
    <link rel="stylesheet" href="../css/login.css">
<script src="../js/dados.js" defer></script><script src="../js/acesso.js" defer></script><script src="../js/login.js" defer></script></head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo-area">

                <img
                    src="../assets/logo.jpeg"
                    alt="Logo Ekklesia"
                >

                <h1>EKKLESIA</h1>

                <p>Gestão para Comunidades</p>

            </div>


            <form id="demo-login">
 <div class="form-group"><label for="access-role">Tipo de acesso</label><select id="access-role"><option value="admin">Administrador</option><option value="member">Membro</option></select></div>
 <div class="form-group" id="member-choice" hidden><label for="demo-member">Seu cadastro demonstrativo</label><select id="demo-member"></select></div>
 <p class="login-note">Demonstração local: escolha um perfil para explorar o sistema. Não há autenticação por senha nesta versão.</p>
 <p id="login-error" role="alert"></p><button type="submit">Entrar na demonstração</button>
 </form>

        </section>


        <div class="versiculo">

            <p>
                "E todos uma só coisa. Como tu, ó Pai, estás em mim,
                e eu em ti."
            </p>

            <span>
                João 17:21
            </span>

        </div>

    </main>


    <footer>

        <p>
            © 2025 Ekklesia - Todos os direitos reservados.
        </p>

    </footer>

</body>

</html>
