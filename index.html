<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ekklesia | Login</title>

    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="logo-area">
                <img src="assets/logo.jpeg" alt="Logo Ekklesia">

                <h1>EKKLESIA</h1>

                <p>Gestão para Comunidades</p>
            </div>

            <form>

                <div class="form-group">
                    <label for="email">E-mail</label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Digite seu e-mail"
                    >
                </div>

                <div class="form-group">
                    <label for="senha">Senha</label>

                    <input
                        type="password"
                        id="senha"
                        name="senha"
                        placeholder="Digite sua senha"
                    >
                </div>

                <button type="submit">
                    Entrar
                </button>

                <a href="#">
                    Esqueci minha senha
                </a>

            </form>

        </section>

        <div class="versiculo">
            <p>
                "E todos uma só coisa. Como tu, ó Pai, estás em mim,
                e eu em ti."
            </p>

            <span>João 17:21</span>
        </div>

    </main>

    <footer>
        <p>© 2025 Ekklesia - Todos os direitos reservados.</p>
    </footer>

</body>

</html>
